[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscanstat"
version = "0.1.0"
description = "Exact-likelihood spatial and space-time scan statistics (Kulldorff 1997) in pure Python with Numba acceleration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Charles-delapore"}]
keywords = ["spatial scan statistic", "Kulldorff", "disease surveillance", "cluster detection", "Monte Carlo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23",
    "numba>=0.57",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Charles-delapore/pyscanstat"
Repository = "https://github.com/Charles-delapore/pyscanstat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
